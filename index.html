<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LIT CASINO | Powered by Lit Energy</title>
    <meta name="description" content="Премиальное онлайн казино в стиле Lit Energy: Блэкджек, Европейская рулетка, комнаты КПД, мемные скины Зубенко и Иван Золо!">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 1. TOP LIT ENERGY HEADER -->
        <header class="lit-header">
            <div class="logo-badge" id="headerLogo" title="Нажмите 5 раз для входа в админку">
                <span class="logo-icon">⚡</span>
                <div class="logo-text-group">
                    <span class="logo-main-text">LIT CASINO</span>
                    <span class="logo-sub-text">ENERGY EDITION</span>
                </div>
            </div>

            <!-- Chips Balance Pill -->
            <div class="header-chips-pill" title="Ваш баланс фишек">
                <span class="chips-icon">🪙</span>
                <span class="chips-amount" id="headerChipsAmount">300</span>
                <button class="btn-add-chips" id="btnAddChips" title="Получить бонус фишек">+</button>
            </div>

            <!-- Sound, Admin & Profile Controls -->
            <div class="header-right">
                <button class="header-btn admin-header-btn" id="btnAdminHeader" title="Панель администратора">⚡ АДМИН</button>
                <button class="header-btn" id="btnToggleSound" title="Звук вкл/выкл">🔊</button>
                <div class="header-user-badge" id="headerUserBadge" title="Профиль">
                    <div class="header-avatar" id="headerUserAvatar"></div>
                    <span class="header-nick" id="headerUserNick">Игрок</span>
                </div>
            </div>
        </header>

        <!-- 2. MAIN VIEWPORT SCREENS -->
        <main class="main-viewport">
            <!-- Screen 1: Lobby of Tables/Rooms (КПД Style) -->
            <section class="screen-container screen-active" id="screenLobby"></section>

            <!-- Screen 2: Active In-Game Room -->
            <section class="screen-container" id="screenRoom"></section>

            <!-- Screen 3: Meme Shop & Wardrobe -->
            <section class="screen-container" id="screenShop"></section>

            <!-- Screen 4: Leaderboard Top Players -->
            <section class="screen-container" id="screenLeaderboard"></section>

            <!-- Screen 5: Profile & Stats -->
            <section class="screen-container" id="screenProfile"></section>
        </main>

        <!-- 3. BOTTOM LIT ENERGY NAVIGATION BAR -->
        <nav class="lit-bottom-nav">
            <button class="nav-item active" data-screen="lobby">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">ЛОББИ</span>
            </button>
            <button class="nav-item" data-screen="quick_blackjack">
                <span class="nav-icon">♠️</span>
                <span class="nav-label">БЛЭКДЖЕК</span>
            </button>
            <button class="nav-item" data-screen="quick_roulette">
                <span class="nav-icon">🎲</span>
                <span class="nav-label">РУЛЕТКА</span>
            </button>
            <button class="nav-item" data-screen="shop">
                <span class="nav-icon">🛍</span>
                <span class="nav-label">СКИНЫ</span>
            </button>
            <button class="nav-item" data-screen="leaderboard">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">ТОП</span>
            </button>
            <button class="nav-item" data-screen="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">ПРОФИЛЬ</span>
            </button>
        </nav>

        <!-- 4. MODAL: REGISTRATION (First launch) -->
        <div class="modal-overlay" id="modalRegister">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="lit-badge-fire">⚡ LIT ENERGY WELCOME</span>
                    <h2 class="lit-title">СОЗДАНИЕ ПЕРСОНАЖА</h2>
                    <p class="lit-subtitle">Выберите внешний вид вашего капера и получите стартовые фишки</p>
                </div>

                <div class="reg-preview-box">
                    <div class="avatar-pedestal" id="regAvatarPreview"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">ВЫБЕРИТЕ ОБРАЗ:</label>
                    <div class="reg-presets-list">
                        <button class="preset-btn selected" data-gender="male" data-skin="fair" data-hair="black" data-style="fade">
                            👨 Парень (Светлый)
                        </button>
                        <button class="preset-btn" data-gender="male" data-skin="tan" data-hair="brown" data-style="undercut">
                            👨 Парень (Смуглый)
                        </button>
                        <button class="preset-btn" data-gender="male" data-skin="dark" data-hair="black" data-style="buzz">
                            👨 Парень (Тёмный)
                        </button>
                        <button class="preset-btn" data-gender="female" data-skin="fair" data-hair="blonde" data-style="wavy">
                            👩 Девушка (Светлая)
                        </button>
                        <button class="preset-btn" data-gender="female" data-skin="medium" data-hair="brown" data-style="ponytail">
                            👩 Девушка (Русая)
                        </button>
                        <button class="preset-btn" data-gender="female" data-skin="dark" data-hair="black" data-style="curls">
                            👩 Девушка (Тёмная)
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">ВАШ НИКНЕЙМ:</label>
                    <input type="text" class="input-lit" id="regNickInput" placeholder="Введите ваш ник..." maxlength="16" value="Lit_Winner">
                </div>

                <div class="bonus-announcement">
                    <div class="bonus-gold-text">🪙 СТАРТОВЫЙ БОНУС: 300 ФИШЕК!</div>
                    <div class="bonus-desc">Начисляется мгновенно каждому новому игроку</div>
                </div>

                <button class="btn-lit btn-lit-fire btn-glow" id="btnSubmitRegister" style="width: 100%;">
                    🔥 НАЧАТЬ ИГРУ
                </button>
            </div>
        </div>

        <!-- 5. MODAL: CREATE ROOM (КПД Style) -->
        <div class="modal-overlay" id="modalCreateRoom">
            <div class="modal-box">
                <div class="modal-header">
                    <span class="lit-badge-fire">⚡ НОВЫЙ СТОЛ</span>
                    <h2 class="lit-title">СОЗДАНИЕ СТОЛА</h2>
                    <p class="lit-subtitle">Настройте параметры вашей комнаты для игры</p>
                </div>

                <div class="form-group">
                    <label class="form-label">НАЗВАНИЕ СТОЛА:</label>
                    <input type="text" class="input-lit" id="createRoomName" placeholder="Например: VIP Клуб Зубенко" maxlength="24" value="Lit Energy Стол">
                </div>

                <div class="form-group">
                    <label class="form-label">РЕЖИМ ИГРЫ:</label>
                    <select class="input-lit" id="createRoomGame">
                        <option value="blackjack">♠️ Блэкджек (21 очко)</option>
                        <option value="roulette">🎲 Европейская Рулетка</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">МИНИМАЛЬНАЯ СТАВКА:</label>
                    <select class="input-lit" id="createRoomMinBet">
                        <option value="10">10 🪙 (Старт)</option>
                        <option value="25" selected>25 🪙 (Любитель)</option>
                        <option value="50">50 🪙 (Профи)</option>
                        <option value="100">100 🪙 (Хайроллер)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">КОЛИЧЕСТВО МЕСТ:</label>
                    <select class="input-lit" id="createRoomMaxPlayers">
                        <option value="2">2 игрока</option>
                        <option value="4" selected>4 игрока</option>
                        <option value="6">6 игроков</option>
                    </select>
                </div>

                <div class="action-buttons-row" style="margin-top: 14px;">
                    <button class="btn-lit btn-lit-secondary" id="btnCloseCreateRoom">ОТМЕНА</button>
                    <button class="btn-lit btn-lit-fire btn-glow" id="btnSubmitCreateRoom">СОЗДАТЬ СТОЛ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts in logical dependency order -->
    <script src="js/audio.js"></script>
    <script src="js/avatar.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/blackjack.js"></script>
    <script src="js/roulette.js"></script>
    <script src="js/rooms.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
